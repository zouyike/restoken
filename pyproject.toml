[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "restoken"
version = "1.0.0"
description = "Residue-semantic tokenization for LLM-based cyclic peptide design"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Yike Zou", email = "zouyike@sjtu.edu.cn"},
]
dependencies = [
    "numpy>=1.26.4",
    "pandas>=2.3.0",
    "scipy>=1.15.0",
]

[project.optional-dependencies]
rdkit = ["rdkit>=2024.9.1"]
benchmark = [
    "rdkit>=2024.9.1",
    "scikit-learn>=1.7.0",
    "matplotlib>=3.9.0",
    "torch>=2.5.1",
    "transformers>=4.48.1",
    "accelerate>=1.6.0",
    "bitsandbytes>=0.49.2",
    "huggingface-hub>=0.26.0",
    "safetensors>=0.4.5",
]

[tool.setuptools.packages.find]
include = ["restoken*"]

[tool.setuptools.package-data]
"restoken.data" = ["*.json", "*.csv"]
